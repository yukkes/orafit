[[case]]
# Observed 実行結果: Oracle 成功; Orafit エラー.
id = "p2.reject-fetch-percent"
title = "fetch percent"
kind = "query"
compare = "ordered"
sql = """
SELECT empno FROM bs_emp ORDER BY empno FETCH FIRST 10 PERCENT ROWS ONLY
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
stage = "translation"
code = "FETCH_PERCENT"
reason = "Deferred: exact Oracle semantics require a separate design; see incompatibility-decisions.md"



