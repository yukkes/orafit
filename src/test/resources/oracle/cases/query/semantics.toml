[[case]]
id = "p2.reject-unknown-set-char-width"
title = "Physical CHAR set width must be explicit"
kind = "query"
compare = "unordered"
sql = """
SELECT fixed_value AS value FROM bs_byte_length
UNION SELECT CAST('A' AS CHAR(4)) AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
stage = "translation"
code = "SET_CHAR_WIDTH"
reason = "Physical CHAR set widths need explicit casts on every branch; no padding approximation"

