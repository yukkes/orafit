[[case]]
id = "connect-by.reject-no-start"
title = "CONNECT BY without START WITH is valid Oracle but outside subset"
kind = "query"
compare = "ordered"
sql = """
SELECT id, parent_id FROM bs_hierarchy CONNECT BY PRIOR id = parent_id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_START"
reason = "Orafit requires an explicit recursion root."

[[case]]
id = "connect-by.reject-join-source"
title = "Hierarchy over joined source is outside subset"
kind = "query"
compare = "ordered"
sql = """
SELECT h.id, d.dname FROM bs_hierarchy h JOIN bs_dept d ON d.deptno = h.deptno START WITH h.parent_id IS NULL CONNECT BY PRIOR h.id = h.parent_id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_SOURCE"
reason = "Top-level hierarchy joins remain fail-closed; normalize the join in an explicit derived source."

[[case]]
id = "connect-by.reject-aggregate"
title = "Aggregate over hierarchy is outside verified evaluation-order subset"
kind = "query"
compare = "ordered"
sql = """
SELECT COUNT(*) AS cnt FROM bs_hierarchy START WITH parent_id IS NULL CONNECT BY PRIOR id = parent_id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_AGGREGATE"
reason = "Aggregate/window hierarchy semantics are intentionally fail-closed."

[[case]]
id = "connect-by.reject-iscycle"
title = "CONNECT_BY_ISCYCLE is intentionally deferred"
kind = "query"
compare = "ordered"
sql = """
SELECT id, CONNECT_BY_ISCYCLE AS is_cycle FROM bs_cycle START WITH id = 1 CONNECT BY NOCYCLE PRIOR id = parent_id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_ISCYCLE"
reason = "Oracle cycle-row semantics require separate differential validation."

[[case]]
id = "connect-by.reject-order-expression"
title = "Arbitrary ORDER SIBLINGS expression remains outside bounded rank-path support"
kind = "query"
compare = "ordered"
sql = """
SELECT id FROM bs_hierarchy START WITH parent_id IS NULL CONNECT BY PRIOR id = parent_id ORDER SIBLINGS BY CASE WHEN name = 'root' THEN 0 ELSE 1 END, id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_ORDER"
reason = "Sibling rank paths support source columns and metadata-preserving UPPER/LOWER aliases or ordinals, not arbitrary expressions."

[[case]]
id = "connect-by.reject-compound-prior"
title = "Compound CONNECT BY predicate is outside direct PRIOR equality subset"
kind = "query"
compare = "ordered"
sql = """
SELECT id, LEVEL AS depth FROM bs_hierarchy START WITH parent_id IS NULL CONNECT BY PRIOR id = parent_id AND name IS NOT NULL
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "CONNECT_BY_PRIOR"
reason = "Current lowering requires one direct PRIOR equality."
