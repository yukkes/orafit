id = "connect-by.prior-arithmetic"
title = "PRIOR arithmetic source expression"
kind = "query"
compare = "unordered"
sql = """
SELECT id, LEVEL AS depth FROM bs_hierarchy START WITH parent_id IS NULL CONNECT BY PRIOR (id + 1) = parent_id
"""

[case.oracle]
