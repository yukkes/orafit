version = 1
feature = "connect-by"

[[case]]
id = "connect-by.basic"
title = "Basic START WITH / CONNECT BY"
kind = "query"
compare = "unordered"
sql = """
SELECT id, parent_id, name FROM bs_hierarchy START WITH parent_id IS NULL CONNECT BY PRIOR id = parent_id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

