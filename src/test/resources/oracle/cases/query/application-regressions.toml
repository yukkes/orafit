version = 1
feature = "application-sql-regressions"

[[case]]
id = "regression.bind-keyword-boundary"
title = "JDBC binds adjacent to AND and OR remain separate tokens"
kind = "query"
compare = "ordered"
sql = """
SELECT empno
  FROM bs_emp
 WHERE empno >= ?AND empno <= ?OR empno = ?
 ORDER BY empno
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "INTEGER"
mode = "in"
value = "1"

[[case.bind]]
index = 2
type = "INTEGER"
mode = "in"
value = "2"

[[case.bind]]
index = 3
type = "INTEGER"
mode = "in"
value = "14"

[[case]]
id = "regression.fixed-char-rpad-comparison"
title = "Fixed CHAR compares with a fully padded RPAD result"
kind = "query"
compare = "ordered"
sql = """
SELECT id
  FROM bs_byte_length
 WHERE fixed_value = RPAD(?, 3)
 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "A"

[[case]]
id = "regression.fixed-char-rpad-row-value-comparison"
title = "Fixed CHAR matches a padded RPAD value in a row-valued IN predicate"
kind = "query"
compare = "ordered"
sql = """
SELECT id
  FROM bs_byte_length
 WHERE (fixed_value, id) IN ((RPAD(?, 3), ?))
 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "A"

[[case.bind]]
index = 2
type = "INTEGER"
mode = "in"
value = "9"

[[case]]
id = "regression.nvl-fixed-char-padding"
title = "NVL preserves fixed CHAR padding and reports VARCHAR2"
kind = "query"
compare = "ordered"
compare_type_name = true
sql = """
SELECT NVL(fixed_value, ' ') AS value
  FROM bs_byte_length
 WHERE id IN (9, 10)
 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
