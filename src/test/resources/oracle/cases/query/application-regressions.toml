[[case]]
id = "regression.union-derived-number"
title = "UNION reconciles a derived Oracle NUMBER expression with a NUMBER column"
kind = "query"
compare = "ordered"
sql = """
SELECT DECODE(job, 'DEV', sal, 0) AS value FROM bs_emp
UNION
SELECT sal AS value FROM bs_emp
ORDER BY value
"""

