outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "regression.add-months-date-column"
title = "ADD_MONTHS composes inside a joined derived table in an UPDATE predicate"
kind = "update"
compare = "update"
sql = """
UPDATE bs_dml target
   SET note = 'shifted'
 WHERE EXISTS (
   SELECT 1
     FROM bs_emp e
     JOIN (
       SELECT TO_CHAR(
                ADD_MONTHS(
                  TO_DATE(CONCAT(year_value, month_value), 'YYYYMM'),
                  -1
                ),
                'YYYYMM'
              ) AS shifted_month
         FROM (
           SELECT '2024' AS year_value, '01' AS month_value
             FROM dual
         )
     ) calendar
       ON calendar.shifted_month = '202312'
    WHERE e.empno = target.id
 )
"""
observe_sql = """
SELECT id, note FROM bs_dml ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

