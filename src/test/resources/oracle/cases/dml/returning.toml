version = 1
feature = "returning"

[[case]]
id = "returning.insert-one"
title = "INSERT RETURNING INTO one value"
kind = "returning"
compare = "returning"
sql = """
INSERT INTO bs_dml(id, code, amount) VALUES (?, ?, ?) RETURNING amount INTO ?
"""
observe_sql = """
SELECT id, code, amount, note FROM bs_dml WHERE id = 101 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "INTEGER"
mode = "in"
value = "101"

[[case.bind]]
index = 2
type = "VARCHAR"
mode = "in"
value = "A"

[[case.bind]]
index = 3
type = "DECIMAL"
mode = "in"
value = "12.50"

[[case.bind]]
index = 4
type = "DECIMAL"
mode = "out"

[[case]]
id = "returning.insert-multiple-values"
title = "INSERT RETURNING INTO multiple values"
kind = "returning"
compare = "returning"
sql = """
INSERT INTO bs_dml(id, code, amount) VALUES (?, ?, ?) RETURNING id, code INTO ?, ?
"""
observe_sql = """
SELECT id, code, amount, note FROM bs_dml WHERE id = 102 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "INTEGER"
mode = "in"
value = "102"

[[case.bind]]
index = 2
type = "VARCHAR"
mode = "in"
value = "B"

[[case.bind]]
index = 3
type = "DECIMAL"
mode = "in"
value = "20"

[[case.bind]]
index = 4
type = "INTEGER"
mode = "out"

[[case.bind]]
index = 5
type = "VARCHAR"
mode = "out"

[[case]]
id = "returning.update-one"
title = "UPDATE RETURNING INTO"
kind = "returning"
compare = "returning"
sql = """
UPDATE bs_dml SET amount = amount + ? WHERE id = ? RETURNING amount INTO ?
"""
observe_sql = """
SELECT id, code, amount, note FROM bs_dml WHERE id = 1 ORDER BY id
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "DECIMAL"
mode = "in"
value = "5"

[[case.bind]]
index = 2
type = "INTEGER"
mode = "in"
value = "1"

[[case.bind]]
index = 3
type = "DECIMAL"
mode = "out"

[[case]]
id = "returning.delete-one"
title = "DELETE RETURNING INTO"
kind = "returning"
compare = "returning"
sql = """
DELETE FROM bs_dml WHERE id = ? RETURNING code INTO ?
"""
