[[case]]
id = "bind.order-by-constant"
title = "ORDER BY bind is a constant expression and does not select a sort column"
kind = "query"
compare = "ordered"
# A bind in ORDER BY is a value expression, not an identifier or a select-list ordinal.
# Every row receives the same bound value, so Oracle executes successfully without reordering.
sql = """
SELECT CAST(sort_value AS VARCHAR(40)) AS sort_value
FROM (
  SELECT 30 AS sort_value, 1 AS source_order FROM dual
  UNION ALL
  SELECT 10 AS sort_value, 2 AS source_order FROM dual
  UNION ALL
  SELECT 20 AS sort_value, 3 AS source_order FROM dual
  ORDER BY source_order
) ordered_values
ORDER BY ?
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"
[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "SORT_VALUE"
