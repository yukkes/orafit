version = 1
feature = "binds"

[[case]]
id = "bind.concat-function"
title = "VARCHAR bind in Oracle CONCAT function"
kind = "query"
compare = "ordered"
sql = """
SELECT CONCAT(?, '%') AS value FROM dual
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"
[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "abc"

[[case]]
id = "bind.concat-null"
title = "NULL VARCHAR bind in concatenation"
kind = "query"
compare = "ordered"
sql = """
SELECT ? || 'X' AS value FROM dual
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"
[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
null = true

[[case]]
id = "bind.concat-number"
