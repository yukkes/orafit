version = 1
feature = "routines"

[[case]]
id = "routine.function-positional"
title = "Scalar function positional arguments"
kind = "call"
compare = "call"
sql = """
BEGIN ? := bs_fn_add(?, ?); END;
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "DECIMAL"
mode = "out"

[[case.bind]]
index = 2
type = "DECIMAL"
mode = "in"
value = "2"

[[case.bind]]
index = 3
type = "DECIMAL"
mode = "in"
value = "3"

