version = 1
feature = "regexp"

[[case]]
id = "regexp.like-basic"
title = "REGEXP_LIKE basic"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN REGEXP_LIKE('abc123', '^[a-z]+[0-9]+$') THEN 1 ELSE 0 END AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "regexp.like-i"
title = "REGEXP_LIKE case insensitive"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN REGEXP_LIKE('AbC', '^abc$', 'i') THEN 1 ELSE 0 END AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

