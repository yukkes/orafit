[[case]]
id = "core.coalesce-single-argument"
title = "COALESCE rejects a single argument with ORA-00938"
kind = "query"
compare = "error"
sql = """
SELECT COALESCE(1) AS value FROM dual
"""

[case.oracle]
outcome = "error"
error_code = 938

[case.orafit]
mode = "same"
code = "COALESCE_ARITY"

[[case]]
id = "core.nullif-null-first"
title = "NULLIF rejects an untyped NULL first argument"
kind = "query"
