[[case]]
id = "p1.nullif-bind-untyped"
title = "NULLIF bind datatype contract"
kind = "query"
compare = "ordered"
sql = "SELECT NULLIF(?, 1) AS value FROM dual"

[[case.bind]]
mode = "in"
index = 1
type = "DECIMAL"
value = "2"

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "FUNCTION_BIND_TYPE"
reason = "Untyped binds require CAST so Oracle datatype validation is known before execution"

