SELECT CASE WHEN CAST('A' AS CHAR(3)) = 'A' THEN 1 ELSE 0 END AS equal_value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "core.char-byte-padding"
title = "Default CHAR length uses Oracle byte semantics for multibyte values"
kind = "query"
compare = "ordered"
sql = """
SELECT CAST('A' AS CHAR(15)) AS ascii_value,
       CAST('３' AS CHAR(15)) AS full_width_value,
       CAST('テキスト１' AS CHAR(15)) AS exact_byte_value
FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

