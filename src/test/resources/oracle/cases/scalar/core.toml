version = 1
feature = "core"

[[case]]
id = "core.dual.literal"
title = "DUAL returns one row"
kind = "query"
compare = "ordered"
sql = """
SELECT 1 AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "core.select-unique"
title = "SELECT UNIQUE is DISTINCT"
kind = "query"
compare = "ordered"
sql = """
SELECT UNIQUE deptno FROM bs_emp ORDER BY deptno
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "core.empty-is-null"
title = "Empty string is NULL"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN '' IS NULL THEN 1 ELSE 0 END AS is_null FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

