version = 1
feature = "string"

[[case]]
id = "string.substr-positive"
title = "SUBSTR positive start"
kind = "query"
compare = "ordered"
sql = """
SELECT SUBSTR('abcdef', 2, 3) AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

