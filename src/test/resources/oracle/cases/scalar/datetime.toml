[[case]]
id = "datetime.round-calendar-boundaries"
title = "ROUND date month, quarter, and year boundaries"
kind = "query"
compare = "ordered"
sql = """
SELECT
  ROUND(DATE '2024-02-15', 'MM') AS month_before,
  ROUND(DATE '2024-02-16', 'MM') AS month_at,
  ROUND(DATE '2024-02-15', 'Q') AS quarter_before,
  ROUND(DATE '2024-02-16', 'Q') AS quarter_at,
  ROUND(DATE '2024-06-30', 'YYYY') AS year_before,
  ROUND(DATE '2024-07-01', 'YYYY') AS year_at
FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

