[[case]]
id = "datetime.timestamp-fraction"
title = "Oracle TIMESTAMP supports fractional precision beyond PostgreSQL"
kind = "query"
compare = "ordered"
sql = """
SELECT TIMESTAMP '2024-02-29 12:34:56.123456789' AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "TIMESTAMP_PRECISION"
reason = "PostgreSQL timestamps have microsecond precision; Orafit rejects Oracle TIMESTAMP literals above six fractional digits instead of silently rounding."

