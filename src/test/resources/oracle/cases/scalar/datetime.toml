version = 1
feature = "datetime"

[[case]]
id = "datetime.date-literal"
title = "DATE literal"
kind = "query"
compare = "ordered"
sql = """
SELECT DATE '2024-02-29' AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-date-default"
title = "TO_DATE default deterministic format"
kind = "query"
compare = "ordered"
sql = """
