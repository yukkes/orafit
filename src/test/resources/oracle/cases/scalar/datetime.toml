"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.add-months-backward-time"
title = "ADD_MONTHS moves backward across month end and preserves DATE time"
kind = "query"
compare = "ordered"
sql = """
SELECT ADD_MONTHS(
  TO_DATE('2024-03-31 12:34:56', 'YYYY-MM-DD HH24:MI:SS'),
  -1
) AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.date-family-metadata"
title = "Oracle DATE metadata for conversion and date functions"
kind = "query"
compare = "ordered"
sql = """
SELECT
  TO_DATE('2024-02-29', 'YYYY-MM-DD') AS converted,
  LAST_DAY(DATE '2024-02-10') AS month_end,
  ADD_MONTHS(DATE '2024-01-31', 1) AS shifted
FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

