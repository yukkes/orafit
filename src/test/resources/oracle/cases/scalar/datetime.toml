  ROUND(TO_DATE('2024-02-29 12:29:59', 'YYYY-MM-DD HH24:MI:SS'), 'HH24') AS hour_before,
  ROUND(TO_DATE('2024-02-29 12:30:00', 'YYYY-MM-DD HH24:MI:SS'), 'HH24') AS hour_at,
  ROUND(TO_DATE('2024-02-29 12:34:29', 'YYYY-MM-DD HH24:MI:SS'), 'MI') AS minute_before,
