[[case]]
id = "datetime.round-subday-boundaries"
title = "ROUND date sub-day half-unit boundaries"
kind = "query"
compare = "ordered"
sql = """
SELECT
  ROUND(TO_DATE('2024-02-29 11:59:59', 'YYYY-MM-DD HH24:MI:SS'), 'DD') AS day_before,
  ROUND(TO_DATE('2024-02-29 12:00:00', 'YYYY-MM-DD HH24:MI:SS'), 'DD') AS day_at,
  ROUND(TO_DATE('2024-02-29 12:29:59', 'YYYY-MM-DD HH24:MI:SS'), 'HH24') AS hour_before,
  ROUND(TO_DATE('2024-02-29 12:30:00', 'YYYY-MM-DD HH24:MI:SS'), 'HH24') AS hour_at,
  ROUND(TO_DATE('2024-02-29 12:34:29', 'YYYY-MM-DD HH24:MI:SS'), 'MI') AS minute_before,
  ROUND(TO_DATE('2024-02-29 12:34:30', 'YYYY-MM-DD HH24:MI:SS'), 'MI') AS minute_at
FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

