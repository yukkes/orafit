version = 1
feature = "datetime"

[[case]]
id = "datetime.date-literal"
title = "DATE literal"
kind = "query"
compare = "ordered"
sql = """
SELECT DATE '2024-02-29' AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-date-default"
title = "TO_DATE default deterministic format"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_DATE('2024-02-29') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-date-format"
title = "TO_DATE explicit numeric format"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_DATE('20240229', 'YYYYMMDD') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-date-bind"
title = "TO_DATE with bind"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_DATE(?, 'YYYY-MM-DD') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "2024-02-29"

[[case]]
id = "datetime.to-date-flexible-punctuation"
title = "TO_DATE permits punctuation variation without FX"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_DATE('2024/02/29', 'YYYY-MM-DD') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-date-format-mismatch"
title = "TO_DATE FX format mismatch raises ORA-01861"
kind = "query"
compare = "error"
sql = """
SELECT TO_DATE('2024/02/29', 'FXYYYY-MM-DD') AS value FROM dual
"""

[case.oracle]
outcome = "error"
error_code = 1861

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-timestamp"
title = "TO_TIMESTAMP fractional seconds"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_TIMESTAMP('2024-02-29 12:34:56.123456', 'YYYY-MM-DD HH24:MI:SS.FF6') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "datetime.to-timestamp-tz"
title = "TO_TIMESTAMP_TZ preserves Oracle offset identity"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_TIMESTAMP_TZ('2024-02-29 12:34:56 +09:00', 'YYYY-MM-DD HH24:MI:SS TZH:TZM') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "reject"
code = "TIMESTAMP_TZ_EXACT"
reason = "PostgreSQL timestamptz normalizes instants and cannot preserve the original Oracle TIMESTAMP WITH TIME ZONE offset identity exactly."

[[case]]
id = "datetime.last-day-leap"
title = "LAST_DAY leap February"
kind = "query"
compare = "ordered"
sql = """
SELECT LAST_DAY(DATE '2024-02-10') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

