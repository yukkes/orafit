[[case]]
id = "number.mod-signs-fractions-nulls"
title = "MOD preserves sign, fractional remainder, and NULL behavior"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN MOD(-7, 3) = -1 AND MOD(7, -3) = 1
 AND MOD(7.5, 2) = 1.5 AND MOD(0, 0) = 0
 AND MOD(NULL, 0) IS NULL AND MOD(7, NULL) IS NULL
 AND MOD('', 3) IS NULL THEN 1 ELSE 0 END AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

