version = 1
feature = "number"

[[case]]
id = "number.to-number.integer"
title = "TO_NUMBER integer"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER('123') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.to-number-decimal"
title = "TO_NUMBER decimal"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER('123.45') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.to-number-bind"
title = "TO_NUMBER JDBC bind"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER(?) AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "123.45"

[[case]]
