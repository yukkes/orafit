version = 1
feature = "number"

[[case]]
id = "number.to-number.integer"
title = "TO_NUMBER integer"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER('123') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.to-number-decimal"
title = "TO_NUMBER decimal"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER('123.45') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.to-number-bind"
title = "TO_NUMBER JDBC bind"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER(?) AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "123.45"

[[case]]
id = "number.to-number-invalid"
title = "Invalid number raises an error"
kind = "query"
compare = "error"
sql = """
SELECT TO_NUMBER('not-a-number') AS value FROM dual
"""

[case.oracle]
outcome = "error"
error_code = 1722

[case.orafit]
mode = "same"

[[case]]
id = "number.implicit-character-comparison"
title = "Character compared with NUMBER"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN '10' = 10 THEN 1 ELSE 0 END AS equal_value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.implicit-character-comparison-reversed"
title = "NUMBER compared with character literal"
kind = "query"
compare = "ordered"
sql = """
SELECT CASE WHEN 10 = '10' THEN 1 ELSE 0 END AS equal_value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

[[case]]
id = "number.implicit-character-comparison-invalid"
title = "Invalid character-to-NUMBER comparison raises ORA-01722"
kind = "query"
compare = "error"
sql = """
SELECT CASE WHEN 'not-a-number' = 10 THEN 1 ELSE 0 END AS equal_value FROM dual
"""

[case.oracle]
outcome = "error"
error_code = 1722

[case.orafit]
mode = "same"

[[case]]
