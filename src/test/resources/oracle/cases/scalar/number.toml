version = 1
feature = "number"

[[case]]
id = "number.to-number.integer"
title = "TO_NUMBER integer"
kind = "query"
compare = "ordered"
sql = """
SELECT TO_NUMBER('123') AS value FROM dual
"""

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

